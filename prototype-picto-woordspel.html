<title>Picto Woordspel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one calm screen at a time. White picto cards with a thick black edge sit on a quiet ground; the picto is always the loudest thing on screen. */
:root{
  --bg:#DCEBE7; --surface:#F1F7F5; --fg:#17302D; --muted:#506965; --line:#B3CAC5;
  --accent:#1B7566; --accent-fg:#FFFFFF; --hot:#C2402E; --good:#2A9A62; --sun:#F2B62B;
  --paper:#FFFFFF; --paper-ink:#1B1F24; --back:#3F6FB0; --tile-ink:#17302D;
  --t1:#F6CD63; --t2:#8ECDBF; --t3:#A9BCEB; --t4:#F3AE86;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Andika",Verdana,system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10211F; --surface:#1A322F; --fg:#E7F2EF; --muted:#9FBAB5; --line:#34554F;
  --accent:#5FC7B5; --accent-fg:#0B1D1B; --hot:#F07C6C; --good:#4CC489; --sun:#F6C445; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10211F; --surface:#1A322F; --fg:#E7F2EF; --muted:#9FBAB5; --line:#34554F;
  --accent:#5FC7B5; --accent-fg:#0B1D1B; --hot:#F07C6C; --good:#4CC489; --sun:#F6C445; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
svg.i{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

#app{min-height:100%;max-width:1080px;margin-inline:auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:18px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;min-height:52px}
.bar h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;text-wrap:balance;min-width:0}
.bar .sub{color:var(--muted);font-size:15px}
.sp{flex:1}
.ib{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--fg);background:transparent;font-weight:700}
.ib.round{width:52px;padding:0;justify-content:center}
.tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:var(--tile-ink);border-radius:999px;padding:3px 10px}

/* picto card */
.pc{background:var(--paper);color:var(--paper-ink);border:4px solid var(--paper-ink);border-radius:var(--r);padding:clamp(6px,1.4vw,12px);display:flex;flex-direction:column;gap:2px;position:relative;min-width:0;transition:opacity .25s,box-shadow .2s,transform .2s}
.pc img{display:block;flex:none;width:100%;height:auto;aspect-ratio:1;object-fit:contain;pointer-events:none;user-select:none}
.pc .w{font-weight:700;text-align:center;font-size:clamp(14px,2.3vw,22px);line-height:1.15;overflow-wrap:anywhere}
.pc.ok{box-shadow:0 0 0 6px var(--good)}
.pc.no{opacity:.28;pointer-events:none}
.pc.sel{box-shadow:0 0 0 6px var(--sun);transform:scale(1.03)}
.pc.found{opacity:.5;box-shadow:0 0 0 5px var(--good);pointer-events:none}
.wob{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.bk,.mc .face{background:radial-gradient(circle,rgba(255,255,255,.4) 0 16%,transparent 17%) 0 0/33.34% 33.34%,var(--back)}

/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{background:var(--tc);color:var(--tile-ink);border:4px solid var(--paper-ink);border-radius:26px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tile:active{transform:scale(.98)}
.prev{display:flex;gap:8px;justify-content:center;width:100%}
.mini{width:min(46%,112px);aspect-ratio:1;padding:6px;border-width:3px;border-radius:14px;justify-content:center;align-items:center}
.mini.spk{background:var(--paper)}
.mini.spk svg{width:60%;height:60%}
.tn{font-family:var(--font-display);font-weight:800;font-size:clamp(19px,2.6vw,24px);line-height:1.05}
.ts{font-size:14px;margin-top:-4px}
h2{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0}
.hint{color:var(--muted);font-size:15px;margin:0;max-width:65ch}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.strip .pc{border-width:3px;border-radius:14px;padding:6px}
.strip .w{font-size:14px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* game */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px)}
.ask{margin:0;font-size:clamp(17px,2.6vw,22px);font-weight:700;text-align:center}
.target{width:min(42vw,30vh,240px)}
.choices{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(10px,2.4vw,22px);width:min(100%,calc(var(--n) * min(210px,32vh)))}
.dots{display:flex;gap:4px;color:var(--line);flex-wrap:wrap}
.dots svg{width:26px;height:26px}
.dots .on{color:var(--sun)}
.speak{width:clamp(96px,22vh,150px);aspect-ratio:1;border-radius:50%;border:4px solid var(--paper-ink);background:var(--sun);color:var(--tile-ink);display:grid;place-items:center}
.speak svg{width:56%;height:56%}
.speak:active{transform:scale(.96)}
.mem{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:clamp(8px,1.6vw,16px);width:min(100%,calc((100vh - 190px) * var(--cols,3) / var(--rows,2)),calc(var(--cols,3) * 190px))}
.mc .face{position:absolute;inset:0;border-radius:calc(var(--r) - 5px);opacity:0;transition:opacity .2s}
.mc.down .face{opacity:1}
.donebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.donebox h1{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,8vw,60px);margin:0}
.bigstars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;color:var(--sun)}
.bigstars svg{width:clamp(34px,8vw,58px);height:clamp(34px,8vw,58px)}
.rowbtn{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--fg);background:transparent;font-weight:700;font-size:16px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:60px;padding:0 26px;font-size:20px}
.btn.sq{width:46px;padding:0}
.btn.on{background:var(--hot);border-color:var(--hot);color:var(--accent-fg)}
.btn.quiet{border-color:var(--line);color:var(--muted)}

/* teacher */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;max-width:420px}
.field label,.lab{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=email],input[type=password],select{min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;width:100%;min-width:0;font-weight:700}
.note{border-left:4px solid var(--sun);padding:6px 12px;margin:0;max-width:70ch}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 14px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.thumbs{display:flex;gap:6px}
.th{width:64px;border-width:2px;border-radius:10px;padding:4px}
.mid{display:flex;flex-direction:column;gap:5px;min-width:0}
.st{font-size:14px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.st .own{color:var(--good);font-weight:700}
.flag{color:var(--hot);font-weight:700}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:2px solid var(--fg);border-radius:999px;overflow:hidden}
.seg button{min-width:52px;min-height:44px;border:0;background:transparent;font-weight:700}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.set{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
@media (max-width:620px){
  .row{grid-template-columns:auto minmax(0,1fr)}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .choices[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,56vh,330px)}
  .ib .t{display:none}.ib{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const central=!!sb;

/* ---------- text ---------- */

const DB={
 open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('picto-woordspel',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},

/* ---------- picto import: fit on white, erase the white from the edges, keep the rest as the shadow ---------- */
function fit(src){
 const c=document.createElement('canvas');c.width=c.height=SIZE;const x=c.getContext('2d',{willReadFrequently:true});
 x.fillStyle='#fff';x.fillRect(0,0,SIZE,SIZE);
 const iw=src.naturalWidth||src.width,ih=src.naturalHeight||src.height,s=Math.min((SIZE-16)/iw,(SIZE-16)/ih),w=iw*s,h=ih*s;
 x.imageSmoothingQuality='high';x.drawImage(src,(SIZE-w)/2,(SIZE-h)/2,w,h);return c;
}
function analyse(c){
 const x=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,p=x.getImageData(0,0,w,h).data,n=w*h;
 const white=i=>{const o=i<<2;return p[o+3]<24||(p[o]>=226&&p[o+1]>=226&&p[o+2]>=226)};
 const bg=new Uint8Array(n),st=new Int32Array(n);let sp=0;
 const push=i=>{if(!bg[i]&&white(i)){bg[i]=1;st[sp++]=i}};
 for(let X=0;X<w;X++){push(X);push((h-1)*w+X)}
 for(let Y=0;Y<h;Y++){push(Y*w);push(Y*w+w-1)}
 while(sp){const i=st[--sp],X=i%w;if(X>0)push(i-1);if(X<w-1)push(i+1);if(i>=w)push(i-w);if(i<n-w)push(i+w)}
 const sc=document.createElement('canvas');sc.width=w;sc.height=h;const sx=sc.getContext('2d'),out=sx.createImageData(w,h),q=out.data;
 let cnt=0,x0=w,y0=h,x1=0,y1=0;
 for(let i=0;i<n;i++){if(bg[i])continue;cnt++;const o=i<<2;q[o]=SHADE[0];q[o+1]=SHADE[1];q[o+2]=SHADE[2];q[o+3]=255;const X=i%w,Y=i/w|0;if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}
 sx.putImageData(out,0,0);
 const G=24;let sig='';
 if(cnt){for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){const X=Math.min(w-1,x0+((gx+.5)/G)*(x1-x0+1)|0),Y=Math.min(h-1,y0+((gy+.5)/G)*(y1-y0+1)|0);sig+=bg[Y*w+X]?'0':'1'}}
 return {img:c.toDataURL('image/png'),shadow:sc.toDataURL('image/png'),sig,area:cnt/n};
}

let actx;const buffers=new Map();let playing=null;
function ac(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A){try{actx=new A()}catch(e){}}}if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});return actx}
async function decode(w){
 if(buffers.has(w.id))return buffers.get(w.id);const a=ac();if(!a||!w.audio)return null;
 const buf=await new Promise((res,rej)=>{const p=a.decodeAudioData(w.audio.slice(0),res,rej);if(p&&p.catch)p.catch(rej)});
 // skip the silence before and after the spoken word
 const d=buf.getChannelData(0);let s=0,e=d.length-1;while(s<e&&Math.abs(d[s])<.02)s++;while(e>s&&Math.abs(d[e])<.02)e--;
 let o={buf,from:0,dur:buf.duration};
 if(e-s>buf.sampleRate*.08){const pad=buf.sampleRate*.08;o={buf,from:Math.max(0,s-pad)/buf.sampleRate,dur:0};o.dur=Math.min(buf.duration,(e+pad*3)/buf.sampleRate)-o.from}
 buffers.set(w.id,o);return o;
}
function hush(){try{if(playing){playing.onended=null;playing.stop()}}catch(e){}playing=null;try{if(hasTTS)speechSynthesis.cancel()}catch(e){}}
async function say(w){
 if(!w)return;hush();
 try{if(w.audio){const o=await decode(w);if(o){const a=ac(),src=a.createBufferSource();src.buffer=o.buf;src.connect(a.destination);src.start(0,o.from,o.dur);playing=src;return new Promise(r=>{src.onended=r;setTimeout(r,o.dur*1000+400)})}}}catch(e){}
 return speak(w.word);
}
function speak(text){return new Promise(r=>{try{if(!hasTTS||!text)return r();const u=new SpeechSynthesisUtterance(text),v=speechSynthesis.getVoices().find(v=>/^nl/i.test(v.lang));u.lang=v?v.lang:'nl-BE';if(v)u.voice=v;u.rate=.85;u.onend=u.onerror=()=>r();speechSynthesis.speak(u);setTimeout(r,2500)}catch(e){r()}})}
function ding(){
 if(!state.ding)return;const a=ac();if(!a)return;const t0=a.currentTime;
 [659.25,880].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t0+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(.11,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.45);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.5)});
}

 const flags=w=>{const f=[];if(w.area<.03)f.push(t('flagEmpty'));else if(w.area>.9)f.push(t('flagBg'));const tw=ws.find(o=>o!==w&&iou(o.sig,w.sig)>LIKE);if(tw)f.push(t('flagLike',tw.word));return f.map(x=>`<span class="flag">${esc(x)}</span>`).join('')};
 const row=w=>{const on=rec&&rec.id===w.id;return `<li class="row">
  <div class="thumbs">${pc(w,{cls:'th'})}${pc(w,{cls:'th',shadow:true,alt:t('shadowN')})}</div>
  <div class="mid"><label class="vh" for="w-${w.id}">${t('word')}</label><input type="text" id="w-${w.id}" data-in="word" data-id="${w.id}" value="${esc(w.word)}" autocomplete="off" autocapitalize="off">
   <div class="st">${w.audio?`<span class="own">${t('own')}</span>`:`<span>${hasTTS?t('tts'):t('none')}</span>`}${flags(w)}</div>
   <label class="chk"><input type="checkbox" id="s-${w.id}" data-in="inShadow" data-id="${w.id}" ${w.inShadow!==false?'checked':''}>${t('inShadow')}</label></div>
  <div class="acts">
   ${micBlocked?'':`<button class="btn ${on?'on':'pri'}" data-act="rec" data-id="${w.id}">${ico(on?'stop':'mic')}${on?t('stop'):t('rec')}</button>`}
   <label class="btn ${micBlocked?'pri':'sq'}" title="${t('file')}">${ico('up')}${micBlocked?t('file'):`<span class="vh">${t('file')}</span>`}<input class="vh" type="file" id="a-${w.id}" accept="audio/*" data-file="audio" data-id="${w.id}"></label>
   <button class="btn sq" data-act="say" data-id="${w.id}" aria-label="${t('play')}" title="${t('play')}">${ico('play')}</button>
   <button class="btn sq quiet" data-act="delWord" data-id="${w.id}" aria-label="${t('delWord')}" title="${t('delWord')}">${ico('x')}</button>
  </div></li>`};
 const sure=Date.now()-sureAt<4000;
 const cen=central?`<div class="set" style="align-items:flex-end"><div class="field" style="flex:1 1 220px"><label for="themeSel">${t('themeSel')}</label><select id="themeSel" data-in="themeSel">${state.themeId&&C.themes.some(x=>x.id===state.themeId)?'':`<option value="">${C.themes.length?'…':t('noTheme')}</option>`}${C.themes.map(x=>`<option value="${x.id}" ${x.id===state.themeId?'selected':''}>${esc(x.name||t('unnamed'))}${x.active?' ★':''}</option>`).join('')}</select></div>
  <button class="btn" data-act="newTheme">${ico('plus')}${t('newTheme')}</button>
  ${state.themeId?(state.active?`<span class="tag">${t('isActive')}</span>`:`<button class="btn pri" data-act="activate">${ico('star','f')}${t('makeActive')}</button>`):''}</div>`:'';
 const seg=(key,vals,lab)=>`<span class="seg" role="group">${vals.map(v=>`<button data-act="set" data-k="${key}" data-v="${v}" aria-pressed="${String(state[key])===String(v)}">${lab?lab(v):v}</button>`).join('')}</span>`;
 return `<div class="bar"><button class="ib round" data-act="home" aria-label="${t('back')}">${ico('back')}</button><h1>${t('tTitle')}</h1><span class="sp"></span></div>
 <div class="panel">
  ${cen}
  <div class="field"><label for="theme">${t('theme')}</label><input type="text" id="theme" data-in="theme" value="${esc(state.theme)}" placeholder="${t('themePh')}" autocomplete="off"></div>
  <div class="rowbtn" style="justify-content:flex-start">
   <label class="btn pri">${ico('plus')}${t('add')}<input class="vh" type="file" id="addp" accept="image/*" multiple data-file="pictos"></label>
   <label class="btn">${ico('up')}${t('addAudio')}<input class="vh" type="file" id="adda" accept="audio/*" multiple data-file="sounds"></label>
  </div>
  <p class="hint">${t('addHint')}</p>
  ${state.sample?`<p class="note">${t('exampleNote')}</p>`:''}${micBlocked?`<p class="note">${t('micBlocked')}</p>`:''}${note?`<p class="note">${esc(note)}</p>`:''}
 </div>
 <div class="panel">
  <div class="st"><span class="lab">${t('count',ws.length)}</span><span>${t('recN',recN,ws.length)}</span>${central?'<span id="sync"></span>':''}</div>
  <ul class="rows">${ws.map(row).join('')}</ul>
 </div>
 <div class="panel"><h2>${t('settings')}</h2>
  <div class="set"><span class="lab">${t('choices')}</span>${seg('choices',[2,3,4])}</div>
  <label class="chk"><input type="checkbox" id="set-words" data-in="showWords" ${state.showWords?'checked':''}>${t('showWords')}</label>
  <label class="chk"><input type="checkbox" id="set-ding" data-in="ding" ${state.ding?'checked':''}>${t('ding')}</label>
  <div class="set"><span class="lab">${t('lang')}</span>${seg('lang',['nl','en'],v=>v==='nl'?'Nederlands':'English')}</div>
  <p class="hint">${central?t('savedCentral'):t('saved')}</p>
  <div class="rowbtn" style="justify-content:flex-start">${central
   ?`<button class="btn" data-act="signOut">${t('signOut')}</button>${state.themeId?`<button class="btn ${sure?'on':'quiet'}" data-act="delTheme">${sure?t('sure'):t('delTheme')}</button>`:''}`
   :`<button class="btn" data-act="sample">${t('loadSample')}</button><button class="btn ${sure?'on':'quiet'}" data-act="clear">${sure?t('sure'):t('clear')}</button>`}</div>
 </div>`;
}

function layoutMem(){
 const el=$('.mem');if(!el||!game||!game.cards)return;const n=game.cards.length,land=innerWidth>=innerHeight;
 const cols=n<=4?2:n<=6?(land?3:2):n<=8?(land?4:2):(land?4:3);
 el.style.setProperty('--cols',cols);el.style.setProperty('--rows',Math.ceil(n/cols));
}
function render(){
 const app=$('#app');document.documentElement.lang=state.lang;
 app.innerHTML=view==='home'?homeView():view==='game'?gameView():view==='done'?doneView():view==='login'?loginView():teacherView();
 layoutMem();paintStatus();
}

/* ---------- games ---------- */
function start(type){
 ac();hush();const ws=state.words;if(ws.length<2)return;
 if(type==='open'||type==='closed'){
  const pick=shuffle(ws).slice(0,Math.min({2:3,3:4,4:6}[state.choices]||4,ws.length));
  game={type,cards:shuffle(pick.flatMap(w=>[{w},{w}])),open:[],found:0,pairs:pick.length,lock:false};
 }else{
  let pool=type==='shadow'?ws.filter(w=>w.inShadow!==false&&w.area>=.03&&w.area<=.9):ws;if(pool.length<2)pool=ws;
  game={type,pool,targets:shuffle(pool).slice(0,Math.min(6,pool.length)),i:0,done:0};newRound();
 }
 view='game';render();if(type==='listen')say(game.targets[0]);
}
function newRound(){
 const g=game,tg=g.targets[g.i],n=Math.min(state.choices,g.pool.length);let others=g.pool.filter(w=>w.id!==tg.id);
 if(g.type==='shadow'){const far=others.filter(w=>iou(w.sig,tg.sig)<=LIKE);if(far.length>=n-1)others=far}
 g.choices=shuffle([tg,...shuffle(others).slice(0,n-1)]);g.solved=false;
}
function star(n){const d=document.querySelectorAll('#dots svg');for(let i=0;i<n&&i<d.length;i++)d[i].classList.add('on')}
async function answer(el,id){
 const g=game;if(!g||g.solved)return;const tg=g.targets[g.i];
 if(id!==tg.id){el.classList.add('no','wob');return}
 g.solved=true;g.done++;el.classList.add('ok');star(g.done);
 if(g.type==='shadow')el.querySelector('img').src=tg.img;
 if(state.showWords&&!el.querySelector('.w'))el.insertAdjacentHTML('beforeend',`<span class="w">${esc(tg.word)}</span>`);
 await cheer(tg);await wait(700);if(game!==g||view!=='game')return;
 g.i++;if(g.i>=g.targets.length){view='done';render();return}
 newRound();render();if(g.type==='listen'){await wait(250);if(game===g)say(g.targets[g.i])}
}
function flip(el,i){
 const g=game;if(!g||g.lock)return;const c=g.cards[i],closed=g.type==='closed';if(c.found)return;
 const at=g.open.indexOf(i);
 if(at>=0){if(!closed){g.open.splice(at,1);el.classList.remove('sel')}return}
 el.classList.remove('wob');el.classList.add('sel');if(closed)el.classList.remove('down');
 g.open.push(i);if(g.open.length<2)return;
 const [a,b]=g.open,els=[a,b].map(k=>$(`.mc[data-i="${k}"]`));
 if(g.cards[a].w.id===g.cards[b].w.id){
  g.cards[a].found=g.cards[b].found=true;g.open=[];g.found++;els.forEach(e=>{e.classList.remove('sel');e.classList.add('found')});star(g.found);
  const done=g.found===g.pairs;cheer(c.w).then(async()=>{if(!done)return;await wait(700);if(game===g&&view==='game'){view='done';render()}});
 }else{
  g.lock=true;setTimeout(()=>{if(game!==g)return;els.forEach(e=>{if(!e)return;e.classList.remove('sel');e.classList.add('wob');if(closed)e.classList.add('down')});g.open=[];g.lock=false},closed?1400:600);
 }
}

/* ---------- events ---------- */
const app=$('#app');
app.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;
 if(act==='home'){hush();game=null;view='home';render()}
 else if(act==='teacher')openTeacher();
 else if(act==='start')start(el.dataset.g);
 else if(act==='say'){ac();say(word(id))}
 else if(act==='replay'){ac();say(game.targets[game.i])}
 else if(act==='ans')answer(el,id);
 else if(act==='flip')flip(el,+el.dataset.i);
 else if(act==='rec'){ac();toggleRec(id)}
 else if(act==='delAudio'){const w=word(id);if(w){w.audio=null;buffers.delete(id);save();render()}}
 else if(act==='delWord'){
  const w=word(id);if(central&&w){state.stamp='';job(async()=>{ok(await sb.from('words').delete().eq('id',id));sb.storage.from('media').remove([w.pictoPath,w.audioPath].filter(Boolean))}).catch(()=>{})}
  state.words=state.words.filter(w=>w.id!==id);buffers.delete(id);save();render();
 }
 else if(act==='newTheme')job(async()=>{const th=ok(await sb.from('themes').insert({name:''}).select().single());C.themes.unshift(th);state.themeId=th.id;state.theme='';state.active=false;state.words=[];state.stamp='';buffers.clear();save()}).then(()=>{render();const i=$('#theme');if(i)i.focus()},render);
 else if(act==='activate')job(async()=>{ok(await sb.from('themes').update({active:false}).eq('active',true));ok(await sb.from('themes').update({active:true}).eq('id',state.themeId));C.themes.forEach(x=>{x.active=x.id===state.themeId});state.active=true;state.stamp='';save()}).then(render,render);
 else if(act==='delTheme'){
  if(Date.now()-sureAt<4000){sureAt=0;const tid=state.themeId,paths=state.words.flatMap(w=>[w.pictoPath,w.audioPath]).filter(Boolean);
   job(async()=>{ok(await sb.from('themes').delete().eq('id',tid));if(paths.length)sb.storage.from('media').remove(paths);C.themes=C.themes.filter(x=>x.id!==tid);state.themeId=null;state.theme='';state.active=false;state.words=[];state.stamp='';buffers.clear();save()}).then(render,render);
  }else{sureAt=Date.now();render()}
 }
 else if(act==='signOut')sb.auth.signOut().catch(()=>{}).then(()=>{C.teacher=false;C.pinned=false;view='home';render();refresh()});
 else if(act==='set'){const k=el.dataset.k;state[k]=k==='choices'?+el.dataset.v:el.dataset.v;save();render()}
 else if(act==='sample'){loadSample();note='';save();render()}
 else if(act==='clear'){if(Date.now()-sureAt<4000){sureAt=0;state.words=[];state.theme='';state.sample=false;buffers.clear();save()}else sureAt=Date.now();render()}
});
app.addEventListener('input',e=>{
 const el=e.target,k=el.dataset.in;if(!k)return;
 if(k==='word'){const w=word(el.dataset.id);if(w){w.word=el.value;save();push('w'+w.id,()=>sb.from('words').update({word:w.word}).eq('id',w.id))}}
 else if(k==='theme'){state.theme=el.value;save();const x=C.themes.find(x=>x.id===state.themeId);if(x){x.name=el.value;const tid=x.id;push('theme',()=>sb.from('themes').update({name:x.name}).eq('id',tid))}}
});
app.addEventListener('change',e=>{
 const el=e.target,k=el.dataset.in,f=el.dataset.file;
 if(k==='inShadow'){const w=word(el.dataset.id);if(w){w.inShadow=el.checked;save();push('s'+w.id,()=>sb.from('words').update({in_shadow:w.inShadow}).eq('id',w.id))}}
 else if(k==='themeSel'){const th=C.themes.find(x=>x.id===el.value);if(th)job(()=>loadTheme(th)).then(render,render)}
 else if(k==='showWords'||k==='ding'){state[k]=el.checked;save()}
 else if(f&&el.files&&el.files.length){const files=[...el.files];
  if(f==='pictos')addPictos(files);else if(f==='sounds')addSounds(files);
  else readFile(files[0],'readAsArrayBuffer').then(buf=>{const w=word(el.dataset.id);if(!w)return;setAudio(w,buf,files[0].type);render();say(w)}).catch(()=>{})}
});
addEventListener('resize',layoutMem);
app.addEventListener('submit',async e=>{
 e.preventDefault();if(e.target.id!=='login'||!central)return;
 const mail=$('#lg-mail').value.trim(),pw=$('#lg-pw').value;$('#lg-go').disabled=true;
 try{ok(await sb.auth.signInWithPassword({email:mail,password:pw}));if(!(await checkTeacher())){await sb.auth.signOut();C.loginErr=t('notTeacher');render();return}openTeacher()}
 catch(err){C.loginErr=t('loginErr');render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home')refresh()});

/* ---------- start ---------- */
(async()=>{
 let saved=null;try{saved=await DB.get(central?'cpack':'pack')}catch(e){}
 if(saved&&Array.isArray(saved.words))state={...state,...saved};else if(!central)loadSample();
 if(central&&state.words.length<2)loadMsg=t('loading');
 render();
 if(central){await checkTeacher();await refresh()}
})();
})();
</script>
